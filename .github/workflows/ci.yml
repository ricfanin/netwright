name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Netwright.slnx -c Release

      - name: Unit tests
        run: |
          dotnet test tests/Netwright.Engine.Tests -c Release --no-build
          dotnet test tests/Netwright.Testing.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Netwright -c Release -o artifacts/nupkg
          dotnet pack src/Netwright.Engine -c Release -o artifacts/nupkg
          dotnet pack src/Netwright.Testing -c Release -o artifacts/nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nupkg/*.nupkg

  # Hosted runners are not guaranteed to provide an interactive desktop for UI Automation.
  # This job is a spike: it must not block merges until it has proven reliable.
  integration:
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: Build fixtures and tests
        run: |
          dotnet build tests/fixtures/Netwright.Fixtures.Wpf -c Release
          dotnet build tests/fixtures/Netwright.Fixtures.WinForms -c Release
          dotnet publish src/Netwright -c Release -r win-x64 -o artifacts/netwright
          dotnet build tests/Netwright.IntegrationTests -c Release

      - name: Integration tests
        run: dotnet test tests/Netwright.IntegrationTests -c Release --no-build --filter "Category!=Perf&Category!=Build" --logger "trx;LogFileName=integration.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: tests/Netwright.IntegrationTests/TestResults/*.trx
